<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Labeling{% endblock %} - Django demo</title>

  <!--
    Tailwind 4 + daisyUI 5, both loaded as browser builds straight from a
    CDN - no Node, no build step, matching how django-impatient/
    moviereviews already pulls Bootstrap from jsDelivr. This is
    prototype-only: the browser build recompiles Tailwind's whole utility
    set on every page load (no scan-and-purge step) and needs internet
    access. A real deployment would compile a small, purged CSS file
    ahead of time instead - see demos/labeling-django/README.md's
    "Styling" section and docs/javascript.md.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="{% url 'queue' %}" class="btn btn-ghost text-lg">Labeling queue</a>
    </div>
    <div class="flex-none">
      {% if user.is_authenticated %}
        <span class="mr-3 text-sm opacity-70">Signed in as {{ user.username }}</span>
        {% if user.is_staff %}
          <a href="{% url 'admin:index' %}" class="btn btn-ghost btn-sm">Admin</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Log in</a>
      {% endif %}
    </div>
  </div>

  <main class="max-w-3xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
